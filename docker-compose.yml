services:
  postgres:
    image: postgres:16
    container_name: music-view-postgres
    environment:
      POSTGRES_DB: musicview
      POSTGRES_USER: musicview
      POSTGRES_PASSWORD: musicview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicview -d musicview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

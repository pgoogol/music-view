spring:
  application:
    name: music-view
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # pełny eksport Exportify (~2500 wierszy) przekracza domyślny 1MB
      max-file-size: 10MB
      # metryki wgrywa się partiami po kilkanaście plików naraz (D31)
      max-request-size: 100MB
  batch:
    job:
      # joby startują wyłącznie przez EnrichmentService, nie przy starcie aplikacji
      enabled: false
    jdbc:
      # tabele BATCH_* zarządza Flyway (migracja V3)
      initialize-schema: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Warstwa AI (D15): provider, model i wersja promptu wyłącznie tutaj — nigdy w kodzie
llm:
  provider: ${LLM_PROVIDER:openai}   # openai (i zgodne: OpenRouter/Groq/Mistral/lokalne) | anthropic
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  base-url: ${LLM_BASE_URL:}         # puste = domyślny URL providera
  prompt-version: v1
  batch-size: 5
  requests-per-second: 2
  max-tokens: 2048
  temperature: 0.2
  # twardy sufit zlecenia (D28) — SELECTED miał limit od M1.6, MISSING nie miał
  # żadnego, a pomyłka w LLM_MODEL przy 2500 utworach to realny rachunek
  max-tracks-per-job: ${LLM_MAX_TRACKS_PER_JOB:500}
  # stawki providera w USD za 1M tokenów; puste = nie znamy cennika i mówimy to
  # wprost zamiast zgadywać (szacunek pokazujemy przed startem joba)
  cost:
    input-per-1m: ${LLM_COST_INPUT_PER_1M:}
    output-per-1m: ${LLM_COST_OUTPUT_PER_1M:}
  # tłumaczenie i interpretacja tekstów (D32) — własna wersja promptu, bo tekst
  # tłumaczy się z innych powodów niż opisuje utwór; jeden utwór na wywołanie.
  # max-chars (wejście) i max-tokens (sufit odpowiedzi) muszą razem zmieścić się
  # w oknie kontekstu modelu i w pamięci karty — na lokalnym modelu zbyt duże
  # wartości kończą się odpowiedzią 4xx silnika (np. „out of device memory"),
  # nie lepszym tłumaczeniem. Przy 8 GB VRAM zacznij od 2500 / 1500.
  lyrics:
    prompt-version: v1
    max-chars: ${LLM_LYRICS_MAX_CHARS:6000}
    max-tokens: ${LLM_LYRICS_MAX_TOKENS:3000}

clients:
  spotify:
    base-url: https://api.spotify.com
    auth-url: https://accounts.spotify.com
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    requests-per-second: 8
    # OAuth PKCE (D4) — adres musi być identyczny z wpisanym w dashboardzie Spotify
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/auth/spotify/callback}
    scopes: playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public
  musicbrainz:
    # twardy limit 1 req/s jest w kodzie klienta (D6) — celowo nie w konfiguracji
    base-url: https://musicbrainz.org
    user-agent: ${MB_USER_AGENT:}
  deezer:
    base-url: https://api.deezer.com
    requests-per-second: 10
  # teksty utworów (D32) — publiczne API bez klucza; user-agent to nie sekret,
  # tylko identyfikacja klienta, o którą prosi serwis (jak MB_USER_AGENT)
  lrclib:
    base-url: https://lrclib.net
    requests-per-second: 2
    user-agent: ${LRCLIB_USER_AGENT:music-view/0.1 (https://github.com/pgoogol/music-view)}

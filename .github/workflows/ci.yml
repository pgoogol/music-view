name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  # Test E2E (M5.3/D30) — osobny job, żeby podstawowy build nie urósł.
  # Przepływ jedzie przeciw SPAKOWANEMU JAROWI (front z /static), a klienci
  # zewnętrzni na lokalnym stubie: bez sieci, bez kluczy, bez Spotify.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: musicview
          POSTGRES_USER: musicview
          POSTGRES_PASSWORD: musicview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicview -d musicview"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package app with frontend
        run: ./mvnw -B --no-transfer-progress -Pfullstack -DskipTests package

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E flow
        working-directory: e2e
        run: npx playwright test

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: e2e/test-results/
